name: Mossad
options:
  bundleIdPrefix: com.dwebber
  deploymentTarget:
    macOS: "26.0"
packages:
  MossadCore:
    path: Packages/MossadCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Mossad:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MossadCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mossad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Updates come from the latest GitHub release; each one is signed with the key whose public half is below.
        SUFeedURL: https://github.com/davidwebber10/mossad/releases/latest/download/appcast.xml
        SUPublicEDKey: Y131ILTxYqpxKtpjHK7imAzNE1qdTsCVCQQVYv2tVBc=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        LSUIElement: true
        NSMicrophoneUsageDescription: Mossad records your microphone during meetings to transcribe what you say.
        NSAudioCaptureUsageDescription: Mossad records the meeting app's audio to transcribe what other people say.
        NSCalendarsFullAccessUsageDescription: Mossad reads your calendar to name meetings and list attendees.
        NSAppleEventsUsageDescription: Mossad reads browser tab addresses to detect Google Meet, Teams, and Zoom web calls.
    entitlements:
      path: App/Mossad.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        # The iPhone app reads finished meetings from this container.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.dwebber.mossad]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwebber.mossad
        # iCloud needs a provisioning profile; Xcode makes it (build with -allowProvisioningUpdates).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 35VNBDXR6B
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        # scripts/release.sh sets both; local builds use the commit count too (scripts/build.sh).
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MossadPhone:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [PhoneApp]
    dependencies:
      - package: MossadCore
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: Mossad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes: [{CFBundleURLName: com.dwebber.mossad.phone, CFBundleURLSchemes: [mossad]}]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: PhoneApp/MossadPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.dwebber.mossad]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwebber.mossad.phone
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 35VNBDXR6B
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
